name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npm run dist:win

      - name: Upload installer to Supabase Storage (stable, own-domain download URL)
        shell: pwsh
        working-directory: apps/desktop
        env:
          SUPABASE_ANON_KEY: sb_publishable_FlEiYeqQCvU7QIu2FSXuPQ_cJ1vfD4k
        run: |
          $file = Get-ChildItem -Path "release" -Filter "*.exe" | Select-Object -First 1
          if (-not $file) { throw "No .exe found in release/" }
          Write-Host "Uploading $($file.FullName) ($($file.Length) bytes)"
          curl.exe -sS --fail -X POST `
            "https://sngjrtuhpuclkbalduzs.supabase.co/storage/v1/object/desktop-app/latest/AccountantAIOperatorSetup.exe" `
            -H "apikey: $env:SUPABASE_ANON_KEY" `
            -H "Authorization: Bearer $env:SUPABASE_ANON_KEY" `
            -H "x-upsert: true" `
            -H "Content-Type: application/x-msdos-program" `
            --data-binary "@$($file.FullName)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: "Accountant AI Operator - Desktop ${{ github.run_number }}"
          files: apps/desktop/release/*.exe
          generate_release_notes: false
          body: |
            בנייה אוטומטית של אפליקציית שולחן העבודה, מ-commit ${{ github.sha }}.
            להתקנה: מורידים את קובץ ה-.exe, מריצים, ונוצר קיצור דרך על שולחן העבודה.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
